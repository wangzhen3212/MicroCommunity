server:
  port: 8008
  tomcat:
    uri-encoding: UTF-8

# 日志路径由环境变量 LOG_PATH 控制（默认 ./MicroCommunityBoot-logs）
# 不要在此设置 logging.file.path，否则会覆盖 BootApplicationStart.createLogDir() 的设置

# ========== sys-client 客户机模块配置 ==========
# 通过环境变量覆盖: SYS_CLIENT_ENABLED, SYS_CLIENT_SERVER_URL 等
sys:
  client:
    # 是否开启客户机功能（默认关闭，开启请改为 true）
    enabled: true
    # 上位机 WebSocket 服务端地址（必填，enabled=true 时生效）
    server-url: ws://106.53.19.207:8080/ws/host
    # 上位机管理员分配的认证 KEY（必填，enabled=true 时生效）
    auth-key: 7ad1b8f83b94f1abb815ceccf4d3429e04a1848ae91c83bfd50c61115639448b
    # 心跳发送间隔（秒），默认30秒
    heartbeat-interval: 30
    # 断线重连最大间隔（秒），默认60秒
    reconnect-max-interval: 60
    # 上位机未上线时的注册重试间隔（秒），默认600秒（10分钟）
    host-retry-interval: 600
    # 上位机 HTTP 代理地址，如 http://host:8080/proxy/out（可选）
    proxy-url: http://106.53.19.207:8080/proxy/out

spring:
  servlet:
    multipart:
      maxFileSize: 50MB
      maxRequestSize: 50MB
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: boot-service
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    password: cszyzh
    pool:
      max-active: 300
      max-wait: 3000
      max-idle: 50
      min-idle: 20
      timeout: 0

  activiti:
    database-schema-update: false
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/TT?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: TT
    password: qq272730334
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 20000

eureka:
  client:
    enabled: false
