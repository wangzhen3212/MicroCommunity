server:
  port: ${SERVER_PORT:8008}
  tomcat:
    uri-encoding: UTF-8

# ========== sys-client 客户机模块配置 ==========
# 通过环境变量覆盖: SYS_CLIENT_ENABLED, SYS_CLIENT_SERVER_URL, SYS_CLIENT_AUTH_KEY, SYS_CLIENT_PROXY_URL
sys:
  client:
    # 是否开启客户机功能（默认关闭 false，开启请改为 true）
    enabled: ${SYS_CLIENT_ENABLED:false}
    # 上位机 WebSocket 服务端地址（必填，enabled=true 时生效）
    server-url: ${SYS_CLIENT_SERVER_URL:ws://127.0.0.1:8080/ws/host}
    # 上位机管理员分配的认证 KEY（必填，enabled=true 时生效）
    auth-key: ${SYS_CLIENT_AUTH_KEY:your-auth-key-here}
    # 心跳发送间隔（秒），默认30秒
    heartbeat-interval: 30
    # 断线重连最大间隔（秒），默认60秒
    reconnect-max-interval: 60
    # 上位机未上线时的注册重试间隔（秒），默认600秒（10分钟）
    host-retry-interval: 600
    # 上位机 HTTP 代理地址，如 http://host:8080/proxy/out（可选）
    proxy-url: ${SYS_CLIENT_PROXY_URL:http://127.0.0.1:8080/proxy/out}

spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: boot-service
  redis:
    database: 0
    host: ${SPRING_REDIS_HOST:127.0.0.1}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:hc}
    pool:
      max-active: 300
      max-wait: 3000
      max-idle: 50
      min-idle: 20
      timeout: 0

  activiti:
    database-schema-update: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/TT?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8}
    username: ${SPRING_DATASOURCE_USERNAME:TT}
    password: ${SPRING_DATASOURCE_PASSWORD:hc12345678}
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 20000

eureka:
  client:
    enabled: false
